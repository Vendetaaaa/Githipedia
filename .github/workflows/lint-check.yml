name: Link Check

on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    # Every Monday at 09:00 UTC — catches links that rotted after merge, not just at PR time.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude-mail
            --accept 200,201,202,203,204,301,302,303,307,308,403,429
            "**/*.md"
          fail: true

      - name: Create issue on scheduled run failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔗 Weekly link check found broken links (${new Date().toISOString().slice(0,10)})`,
              body: "The scheduled link-check workflow found one or more broken links. Check the [workflow run](" + `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` + ") for details.",
              labels: ["correction"]
            });
